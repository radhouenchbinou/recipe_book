global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project:     trading-bot

# ── Alerting rules ──────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"

# ── Scrape configs ──────────────────────────────────────────────────────────
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: bot
    static_configs:
      - targets: ["bot:8080"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
