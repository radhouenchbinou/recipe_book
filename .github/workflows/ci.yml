name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Python Bot Tests ───────────────────────────────────────────────────────
  bot-tests:
    name: Bot — pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: tradingbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U trader"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run pytest with coverage (80% gate)
        working-directory: bot
        env:
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: dummy
          ALPACA_API_KEY: dummy
          ALPACA_SECRET_KEY: dummy
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload bot coverage
        uses: codecov/codecov-action@v4
        with:
          files: bot/coverage.xml
          flags: bot

      - name: Lint with flake8
        working-directory: bot
        run: |
          pip install flake8
          flake8 . --count --max-line-length=100 --extend-ignore=E203,W503 \
            --exclude=alembic/,__pycache__,.pytest_cache

  # ── Alembic Migration Check ────────────────────────────────────────────────
  migration-check:
    name: Bot — Alembic migrations
    runs-on: ubuntu-latest
    needs: bot-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: tradingbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U trader"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run migrations head
        working-directory: bot
        env:
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
        run: alembic upgrade head

      - name: Verify downgrade works
        working-directory: bot
        env:
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
        run: alembic downgrade base

      - name: Re-apply to confirm idempotency
        working-directory: bot
        env:
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
        run: alembic upgrade head

  # ── Node.js API Tests ──────────────────────────────────────────────────────
  api-tests:
    name: API — Jest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: tradingbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U trader"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Run tests with coverage
        working-directory: api
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          DEV_USERNAME: admin
          DEV_PASSWORD: changeme
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
          REDIS_URL: redis://localhost:6379
        run: npm test -- --forceExit --coverage

      - name: Upload API coverage
        uses: codecov/codecov-action@v4
        with:
          files: api/coverage/lcov.info
          flags: api

  # ── React Dashboard Tests ──────────────────────────────────────────────────
  dashboard-tests:
    name: Dashboard — Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run tests with coverage
        working-directory: dashboard
        run: npm test -- --coverage

      - name: Upload dashboard coverage
        uses: codecov/codecov-action@v4
        with:
          files: dashboard/coverage/lcov.info
          flags: dashboard

  # ── Security Scan ──────────────────────────────────────────────────────────
  security:
    name: Security — audit + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit API dependencies (high severity)
        working-directory: api
        run: npm audit --audit-level=high || true

      - name: Audit Dashboard dependencies (high severity)
        working-directory: dashboard
        run: npm audit --audit-level=high || true

      - name: Python safety check
        run: |
          pip install safety
          safety check -r bot/requirements.txt --ignore 70612 || true

      - name: Bandit SAST (Python)
        run: |
          pip install bandit
          bandit -r bot/ -ll -x bot/tests,bot/alembic \
            --format json -o bandit-report.json || true
          cat bandit-report.json | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          hi = [i for i in r.get('results',[]) if i['issue_severity']=='HIGH']
          if hi:
            print(f'HIGH severity issues found: {len(hi)}')
            for i in hi: print(f'  {i[\"filename\"]}:{i[\"line_number\"]} — {i[\"issue_text\"]}')
            sys.exit(1)
          print('No HIGH severity SAST issues.')
          "

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # ── All-pass gate ──────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [bot-tests, migration-check, api-tests, dashboard-tests, security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          failed=$(echo "$results" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          fails = [k for k, v in d.items() if v['result'] not in ('success','skipped')]
          print(' '.join(fails))
          ")
          if [ -n "$failed" ]; then
            echo "Failed jobs: $failed"
            exit 1
          fi
          echo "All CI jobs passed."
