name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Python Bot Tests ───────────────────────────────────────────────────────
  bot-tests:
    name: Bot — pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: tradingbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U trader"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run pytest with coverage
        working-directory: bot
        env:
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: dummy
          ALPACA_API_KEY: dummy
          ALPACA_SECRET_KEY: dummy
        run: pytest --cov=. --cov-report=xml --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: bot/coverage.xml
          flags: bot

  # ── Node.js API Tests ──────────────────────────────────────────────────────
  api-tests:
    name: API — Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Run tests
        working-directory: api
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          DEV_USERNAME: admin
          DEV_PASSWORD: changeme
          DATABASE_URL: postgresql://trader:trader@localhost:5432/tradingbot_test
        run: npm test -- --forceExit

  # ── React Dashboard Tests ──────────────────────────────────────────────────
  dashboard-tests:
    name: Dashboard — Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run tests
        working-directory: dashboard
        run: npm test

  # ── Security Scan ──────────────────────────────────────────────────────────
  security:
    name: Security — audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit API dependencies
        working-directory: api
        run: npm audit --audit-level=high || true

      - name: Audit Dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high || true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true
